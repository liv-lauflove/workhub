name: Test

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm run test
    - run: pnpm run test:profile-permissions
    - run: pnpm run test:task-kanban-checklist
    - run: pnpm run test:task-attachments
    - run: pnpm run test:atomic-invitation-claim
